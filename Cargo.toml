[package]
name = "codeberg"
version = "0.3.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "codeberg client"
homepage = "https://codeberg.org/gsablok/codeberg"
repository = "https://codeberg.org/gsablok/codeberg"
keywords = ["git","codeberg","gitclient", "interface"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["full"] }
vornix-banner = "0.0.1"
